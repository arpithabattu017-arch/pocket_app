<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PocketPlan</title>

<style>
body {
    font-family: system-ui;
    margin: 0;
    background: #f5f7fb;
    color: #151923;
}

.wrap {
    max-width: 980px;
    margin: auto;
    padding: 24px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.grid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 12px;
}

.card {
    background: white;
    border: 1px solid #e7eaf0;
    border-radius: 16px;
    padding: 18px;
}

.cats {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 12px;
}

.bar {
    height: 7px;
    background: #eef0f4;
    border-radius: 99px;
    overflow: hidden;
    margin: 10px 0;
}

.bar i {
    display: block;
    height: 100%;
    background: #635bff;
}

button {
    background: #635bff;
    color: white;
    border: 0;
    border-radius: 10px;
    padding: 10px 14px;
    font-weight: 700;
    cursor: pointer;
}

button.secondary {
    background: #eef0f4;
    color: #333;
}

button.success {
    background: #1e8e5a;
}

input,
select {
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
}

.row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 15px 0;
}

.txn,
.shop-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    border-top: 1px solid #eee;
    padding: 12px 0;
}

.shop-left {
    display: flex;
    gap: 10px;
    align-items: center;
}

.shop-item.done .shop-name {
    text-decoration: line-through;
    color: #888;
}

.muted {
    color: #6f7787;
    font-size: 13px;
}

.section {
    margin-top: 32px;
}

@media(max-width:700px) {

    .grid,
    .cats {
        grid-template-columns: 1fr;
    }

    .top {
        align-items: flex-start;
        gap: 10px;
        flex-direction: column;
    }

    .txn,
    .shop-item {
        align-items: flex-start;
        flex-direction: column;
    }

    input,
    select {
        width: 100%;
        box-sizing: border-box;
    }
}
</style>
</head>

<body>

<div class="wrap">

    <div class="top">
        <div>
            <h1>PocketPlan</h1>

            <div class="muted">
                Budget, spend and plan your shopping.
            </div>
        </div>

        <input type="month" id="month">
    </div>


    <div class="grid" id="summary"></div>


    <!-- CATEGORIES -->

    <div class="section">

        <h2>Categories</h2>

        <div class="row">

            <input
                id="cname"
                placeholder="Category"
            >

            <input
                id="cbudget"
                type="number"
                placeholder="Budget"
            >

            <button onclick="addCategory()">
                Add category
            </button>

        </div>

        <div class="cats" id="cats"></div>

    </div>


    <!-- ADD EXPENSE -->

    <div class="section">

        <h2>Add Expense</h2>

        <div class="row">

            <select id="ecat"></select>

            <input
                id="eamt"
                type="number"
                placeholder="Amount"
            >

            <input
                id="enote"
                placeholder="Note"
            >

            <input
                id="edate"
                type="date"
            >

            <button onclick="addExpense()">
                Save expense
            </button>

        </div>

    </div>


    <!-- SHOPPING LIST -->

    <div class="section">

        <h2>Shopping List</h2>

        <div class="row">

            <input
                id="sname"
                placeholder="Shopping item"
            >

            <input
                id="sprice"
                type="number"
                placeholder="Expected price"
            >

            <button onclick="addShoppingItem()">
                Add item
            </button>

        </div>


        <div class="card">

            <div
                id="shoppingSummary"
                class="muted">
            </div>

            <div id="shoppingList"></div>

        </div>

    </div>


    <!-- TRANSACTIONS -->

    <div class="section">

        <div class="card">

            <h3>Transactions</h3>

            <div id="txns"></div>

        </div>

    </div>

</div>


<script>

const CK = 'pp_categories';
const TK = 'pp_txns';
const SK = 'pp_shopping';


let cats =
    JSON.parse(
        localStorage.getItem(CK) || '[]'
    );


let txns =
    JSON.parse(
        localStorage.getItem(TK) || '[]'
    );


let shopping =
    JSON.parse(
        localStorage.getItem(SK) || '[]'
    );


const month =
    document.getElementById('month');


const edate =
    document.getElementById('edate');


month.value =
    new Date()
        .toISOString()
        .slice(0,7);


edate.value =
    new Date()
        .toISOString()
        .slice(0,10);


month.onchange = render;


const fmt = n =>
    '₹' +
    Number(n || 0)
        .toLocaleString(
            'en-IN',
            {
                maximumFractionDigits: 0
            }
        );


function save() {

    localStorage.setItem(
        CK,
        JSON.stringify(cats)
    );


    localStorage.setItem(
        TK,
        JSON.stringify(txns)
    );


    localStorage.setItem(
        SK,
        JSON.stringify(shopping)
    );


    render();
}


/* ==========================
   CATEGORY
========================== */

function addCategory() {

    let name =
        document
            .getElementById('cname')
            .value
            .trim();


    let budget =
        Number(
            document
                .getElementById('cbudget')
                .value
        );


    if (!name || budget <= 0) {
        return;
    }


    cats.push({

        id: crypto.randomUUID(),

        name: name,

        budget: budget,

        month: month.value

    });


    document.getElementById('cname').value = '';

    document.getElementById('cbudget').value = '';


    save();
}


function deleteCategory(id) {

    cats =
        cats.filter(
            c => c.id !== id
        );


    save();
}


/* ==========================
   EXPENSES
========================== */

function addExpense() {

    let categoryId =
        document
            .getElementById('ecat')
            .value;


    let amount =
        Number(
            document
                .getElementById('eamt')
                .value
        );


    let note =
        document
            .getElementById('enote')
            .value
            .trim();


    let date =
        document
            .getElementById('edate')
            .value;


    if (!categoryId || amount <= 0) {
        return;
    }


    txns.unshift({

        id: crypto.randomUUID(),

        categoryId: categoryId,

        amount: amount,

        note: note,

        date: date

    });


    document.getElementById('eamt').value = '';

    document.getElementById('enote').value = '';


    save();
}


function deleteTransaction(id) {

    txns =
        txns.filter(
            t => t.id !== id
        );


    save();
}


/* ==========================
   SHOPPING LIST
========================== */

function addShoppingItem() {

    let name =
        document
            .getElementById('sname')
            .value
            .trim();


    let price =
        Number(
            document
                .getElementById('sprice')
                .value
        ) || 0;


    if (!name) {
        return;
    }


    shopping.push({

        id: crypto.randomUUID(),

        name: name,

        price: price,

        purchased: false,

        addedToExpense: false,

        month: month.value

    });


    document.getElementById('sname').value = '';

    document.getElementById('sprice').value = '';


    save();
}


function editShoppingItem(id) {

    let item =
        shopping.find(
            x => x.id === id
        );


    if (!item || item.addedToExpense) {
        return;
    }


    let newName =
        prompt(
            'Item name:',
            item.name
        );


    if (newName === null) {
        return;
    }


    newName =
        newName.trim();


    if (!newName) {
        return;
    }


    let newPrice =
        prompt(
            'Expected price:',
            item.price || 0
        );


    if (newPrice === null) {
        return;
    }


    newPrice =
        Number(newPrice);


    if (
        !Number.isFinite(newPrice)
        ||
        newPrice < 0
    ) {

        alert(
            'Please enter a valid price.'
        );

        return;
    }


    item.name = newName;

    item.price = newPrice;


    save();
}


function toggleShoppingItem(id) {

    let item =
        shopping.find(
            x => x.id === id
        );


    if (!item) {
        return;
    }


    item.purchased =
        !item.purchased;


    save();
}


function deleteShoppingItem(id) {

    shopping =
        shopping.filter(
            x => x.id !== id
        );


    save();
}


function addShoppingToExpense(id) {

    let item =
        shopping.find(
            x => x.id === id
        );


    if (
        !item
        ||
        !item.price
        ||
        item.addedToExpense
    ) {

        return;

    }


    let shoppingCategory =
        cats.find(

            c =>
                c.month === month.value
                &&
                c.name
                    .toLowerCase()
                    === 'shopping'

        );


    /*
       If Shopping category doesn't exist,
       automatically create it.
    */

    if (!shoppingCategory) {

        shoppingCategory = {

            id: crypto.randomUUID(),

            name: 'Shopping',

            budget: 0,

            month: month.value

        };


        cats.push(
            shoppingCategory
        );

    }


    txns.unshift({

        id: crypto.randomUUID(),

        categoryId:
            shoppingCategory.id,

        amount:
            item.price,

        note:
            item.name,

        date:
            new Date()
                .toISOString()
                .slice(0,10)

    });


    item.purchased = true;

    item.addedToExpense = true;


    save();
}


/* ==========================
   RENDER MAIN DASHBOARD
========================== */

function render() {

    let monthlyCategories =
        cats.filter(
            c =>
                c.month === month.value
        );


    let monthlyTransactions =
        txns.filter(
            t =>
                t.date.startsWith(
                    month.value
                )
        );


    let spent = {};


    monthlyTransactions
        .forEach(
            t => {

                spent[t.categoryId] =
                    (
                        spent[t.categoryId]
                        || 0
                    )
                    +
                    Number(t.amount);

            }
        );


    let totalBudget =
        monthlyCategories
            .reduce(
                (sum,c) =>
                    sum +
                    Number(c.budget),
                0
            );


    let totalSpent =
        monthlyTransactions
            .reduce(
                (sum,t) =>
                    sum +
                    Number(t.amount),
                0
            );


    let remaining =
        totalBudget
        -
        totalSpent;


    document
        .getElementById('summary')
        .innerHTML = `

        <div class="card">

            <div class="muted">
                Budget
            </div>

            <h2>
                ${fmt(totalBudget)}
            </h2>

        </div>


        <div class="card">

            <div class="muted">
                Spent
            </div>

            <h2>
                ${fmt(totalSpent)}
            </h2>

        </div>


        <div class="card">

            <div class="muted">
                Remaining
            </div>

            <h2>
                ${fmt(remaining)}
            </h2>

        </div>

    `;


    /* CATEGORY CARDS */

    let catsHTML =
        monthlyCategories
            .map(
                category => {

                    let categorySpent =
                        spent[
                            category.id
                        ]
                        || 0;


                    let remaining =
                        Number(
                            category.budget
                        )
                        -
                        categorySpent;


                    let percent =
                        category.budget
                        ?
                        Math.min(
                            100,
                            categorySpent
                            /
                            category.budget
                            *
                            100
                        )
                        :
                        0;


                    return `

                    <div class="card">

                        <button
                            class="secondary"
                            style="float:right;padding:5px 9px"
                            onclick="deleteCategory('${category.id}')"
                        >
                            ×
                        </button>


                        <h3>
                            ${category.name}
                        </h3>


                        <h2>
                            ${fmt(remaining)}
                        </h2>


                        <div class="muted">

                            remaining of

                            ${fmt(
                                category.budget
                            )}

                        </div>


                        <div class="bar">

                            <i
                                style="
                                width:${percent}%
                                ">
                            </i>

                        </div>


                        <div class="muted">

                            Spent

                            ${fmt(
                                categorySpent
                            )}

                        </div>

                    </div>

                    `;

                }
            )
            .join('');


    document
        .getElementById('cats')
        .innerHTML =

        catsHTML

        ||

        `
        <div class="card muted">
            No categories yet.
        </div>
        `;


    /* EXPENSE CATEGORY SELECT */

    document
        .getElementById('ecat')
        .innerHTML =

        monthlyCategories
            .map(
                c =>

                `
                <option value="${c.id}">
                    ${c.name}
                </option>
                `

            )
            .join('');


    /* TRANSACTION HISTORY */

    document
        .getElementById('txns')
        .innerHTML =

        monthlyTransactions
            .map(
                transaction => {

                    let category =
                        cats.find(
                            c =>
                                c.id
                                ===
                                transaction.categoryId
                        );


                    return `

                    <div class="txn">

                        <div>

                            <b>

                                ${
                                    transaction.note
                                    ||
                                    category?.name
                                    ||
                                    'Expense'
                                }

                            </b>


                            <div class="muted">

                                ${
                                    category?.name
                                    ||
                                    'Deleted category'
                                }

                                ·

                                ${transaction.date}

                            </div>

                        </div>


                        <div>

                            <b>
                                -${fmt(
                                    transaction.amount
                                )}
                            </b>


                            <button
                                class="secondary"
                                style="
                                padding:5px 9px;
                                margin-left:5px;
                                "
                                onclick="deleteTransaction('${transaction.id}')"
                            >
                                ×
                            </button>

                        </div>

                    </div>

                    `;

                }
            )
            .join('')

        ||

        `
        <div class="muted">
            No transactions yet.
        </div>
        `;


    renderShopping();
}


/* ==========================
   RENDER SHOPPING LIST
========================== */

function renderShopping() {

    let list =
        shopping.filter(
            item =>
                item.month
                ===
                month.value
        );


    let totalPlanned =
        list.reduce(
            (sum,item) =>
                sum
                +
                Number(
                    item.price || 0
                ),
            0
        );


    let purchasedTotal =
        list
            .filter(
                item =>
                    item.purchased
            )
            .reduce(
                (sum,item) =>
                    sum
                    +
                    Number(
                        item.price || 0
                    ),
                0
            );


    let remainingPlanned =
        totalPlanned
        -
        purchasedTotal;


    document
        .getElementById(
            'shoppingSummary'
        )
        .innerHTML = `

        Planned:
        <b>
            ${fmt(totalPlanned)}
        </b>

        &nbsp; · &nbsp;

        Purchased:
        <b>
            ${fmt(purchasedTotal)}
        </b>

        &nbsp; · &nbsp;

        Remaining planned:
        <b>
            ${fmt(remainingPlanned)}
        </b>

    `;


    document
        .getElementById(
            'shoppingList'
        )
        .innerHTML =

        list
            .map(
                item => `

                <div
                    class="
                    shop-item
                    ${
                        item.purchased
                        ?
                        'done'
                        :
                        ''
                    }
                    "
                >

                    <div class="shop-left">

                        <input
                            type="checkbox"

                            ${
                                item.purchased
                                ?
                                'checked'
                                :
                                ''
                            }

                            onchange="
                                toggleShoppingItem(
                                    '${item.id}'
                                )
                            "
                        >


                        <div>

                            <div class="shop-name">

                                <b>
                                    ${item.name}
                                </b>

                            </div>


                            <div class="muted">

                                Expected:

                                ${fmt(
                                    item.price
                                )}

                            </div>

                        </div>

                    </div>


                    <div class="row">


                        ${
                            item.price
                            &&
                            !item.addedToExpense

                            ?

                            `

                            <button
                                class="success"
                                onclick="
                                    addShoppingToExpense(
                                        '${item.id}'
                                    )
                                "
                            >
                                Add to expenses
                            </button>

                            `

                            :

                            ''
                        }


                        ${
                            item.addedToExpense

                            ?

                            `

                            <span class="muted">
                                Added to expenses ✓
                            </span>

                            `

                            :

                            ''
                        }


                        ${
                            !item.addedToExpense

                            ?

                            `

                            <button
                                class="secondary"
                                onclick="
                                    editShoppingItem(
                                        '${item.id}'
                                    )
                                "
                            >
                                Edit
                            </button>

                            `

                            :

                            ''
                        }


                        <button
                            class="secondary"
                            onclick="
                                deleteShoppingItem(
                                    '${item.id}'
                                )
                            "
                        >
                            Delete
                        </button>


                    </div>

                </div>

                `
            )
            .join('')

        ||

        `
        <div class="muted">
            No shopping items yet.
        </div>
        `;
}


/* ==========================
   DEFAULT CATEGORIES
========================== */

if (!cats.length) {

    cats = [

        {

            id:
                crypto.randomUUID(),

            name:
                'Grocery',

            budget:
                10000,

            month:
                month.value

        },

        {

            id:
                crypto.randomUUID(),

            name:
                'Transport',

            budget:
                5000,

            month:
                month.value

        },

        {

            id:
                crypto.randomUUID(),

            name:
                'Shopping',

            budget:
                6000,

            month:
                month.value

        }

    ];


    save();

}
else {

    render();

}

</script>

</body>
</html>
